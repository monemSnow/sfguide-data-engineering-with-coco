version: 2

models:
  - name: customers
    description: Customer dimension with nation and region attributes
    columns:
      - name: customer_key
        description: Primary key from the customer source table
        tests:
          - not_null
          - unique
      - name: customer_name
        description: Full name of the customer
        tests:
          - not_null
      - name: phone
        description: Customer phone number
        tests:
          - not_null
      - name: account_balance
        description: Customer account balance
        tests:
          - not_null
      - name: market_segment
        description: Market segment the customer belongs to
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AUTOMOBILE', 'BUILDING', 'FURNITURE', 'HOUSEHOLD', 'MACHINERY']
      - name: nation
        description: Nation name derived from the nation table
        tests:
          - not_null
      - name: region
        description: Region name derived from the region table
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AFRICA', 'AMERICA', 'ASIA', 'EUROPE', 'MIDDLE EAST']

  - name: orders_summary
    description: Order-level summary with aggregated line item metrics
    columns:
      - name: order_key
        description: Primary key from the orders source table
        tests:
          - not_null
          - unique
      - name: customer_key
        description: Foreign key to the customers model
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('customers')
                field: customer_key
      - name: order_status
        description: Current status of the order
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['F', 'O', 'P']
      - name: order_priority
        description: Priority level of the order
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1-URGENT', '2-HIGH', '3-MEDIUM', '4-NOT SPECIFIED', '5-LOW']
      - name: order_date
        description: Date the order was placed
        tests:
          - not_null
      - name: order_total_price
        description: Total price of the order from the orders table
        tests:
          - not_null
      - name: line_item_count
        description: Number of line items in the order
        tests:
          - not_null
      - name: total_quantity
        description: Sum of quantities across all line items
        tests:
          - not_null
      - name: total_extended_price
        description: Sum of extended prices across all line items
        tests:
          - not_null
      - name: total_net_price
        description: Sum of extended prices after discount
        tests:
          - not_null
      - name: total_charged_price
        description: Sum of extended prices after discount and tax
        tests:
          - not_null

  - name: supplier_performance
    description: Supplier-level performance summary with order count, revenue, and discount metrics
    columns:
      - name: supplier_key
        description: Primary key from the supplier source table
        tests:
          - not_null
          - unique
      - name: supplier_name
        description: Name of the supplier
        tests:
          - not_null
      - name: total_orders
        description: Count of distinct orders fulfilled by the supplier
        tests:
          - not_null
      - name: total_revenue
        description: Sum of net revenue across all line items for the supplier
        tests:
          - not_null
      - name: average_discount
        description: Average discount applied across the supplier line items
        tests:
          - not_null
